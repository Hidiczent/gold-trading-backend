services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gold_trading
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gold_trading']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: gold_trading
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: change-me-use-long-random-string-in-production
      JWT_EXPIRES_IN: 1d
      GOLD_PRICE_PER_GRAM: 5000000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_AUTH_WINDOW_MS: 900000
      RATE_LIMIT_AUTH_MAX: 20
      RATE_LIMIT_FINANCIAL_WINDOW_MS: 60000
      RATE_LIMIT_FINANCIAL_MAX: 30
      CORS_ORIGIN: '*'
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
